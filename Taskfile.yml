version: '3'

env:
  UID:
    sh: id -u
  GID:
    sh: id -g

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Copy .env.example to .env (fill in values afterwards)
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  build:
    desc: Build the test image
    cmds:
      - docker compose build

  test:run:all:
    desc: Run tests (toggles via shell env, e.g. HTML_DUMP=1 task test:run:all, SCREENSHOTS=0 task test:run:all)
    cmds:
      - rm -rf screenshots/*
      - docker compose run --rm tests

  test:run:
    desc: Run single test file/function (task test:run TEST=tests/user/test_chat.py::test_...; same env toggles)
    vars:
      TEST: '{{.TEST | default "tests/user/test_chat.py"}}'
    cmds:
      - docker compose run --rm tests pytest {{.TEST}}

  test:headed:
    desc: Run tests locally (not in Docker) with visible browser windows (task test:headed TEST=tests/user/test_chat.py -- --slowmo 500)
    vars:
      TEST: '{{.TEST | default "tests/user/test_chat.py"}}'
    cmds:
      - uv run playwright install chromium
      - uv run pytest --headed {{.TEST}} {{.CLI_ARGS}}

  test:debug:
    desc: Step through a test locally in the Playwright Inspector (task test:debug TEST=tests/user/test_chat.py::test_...)
    vars:
      TEST: '{{.TEST | default "tests/user/test_chat.py"}}'
    env:
      PWDEBUG: '1'
    cmds:
      - uv run playwright install chromium
      - uv run pytest {{.TEST}} {{.CLI_ARGS}}

  test:list:
    desc: List test node ids usable as TEST= (task test:list)
    cmds:
      - docker compose run --rm tests pytest --collect-only -q

  explore:
    desc: Run exploration script (task explore -- <url_path> --login user --click "#sel")
    cmds:
      - docker compose run --rm tests python exploration/explore.py {{.CLI_ARGS}}

  lint:
    desc: Run markdown and changelog checks
    cmds:
      - task: lint:markdown
      - task: lint:changelog

  lint:markdown:
    desc: Lint all markdown files (task lint:markdown -- --fix to autofix)
    cmds:
      - docker run -v ./:/md --rm itkdev/markdownlint markdownlint {{.CLI_ARGS}} '**/*.md'

  lint:changelog:
    desc: Check that CHANGELOG.md has changed compared to origin/main
    cmds:
      - git fetch origin main
      - git diff --quiet origin/main -- CHANGELOG.md && echo "CHANGELOG.md not updated" && exit 1 || exit 0
