version: '3'

env:
  UID:
    sh: id -u
  GID:
    sh: id -g

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Copy .env.example to .env (fill in values afterwards)
    cmds:
      - cp .env.example .env
    status:
      - test -f .env

  build:
    desc: Build the test image
    cmds:
      - docker compose build

  tests:
    desc: Run tests (toggles via shell env, e.g. HTML_DUMP=1 task tests, SCREENSHOTS=0 task tests)
    cmds:
      - rm -rf screenshots/*
      - docker compose run --rm tests

  test:
    desc: Run single test module/method (task test TEST=tests.user.test_chat; same env toggles)
    vars:
      TEST: '{{.TEST | default "tests.user.test_chat"}}'
    cmds:
      - docker compose run --rm tests python -m unittest {{.TEST}}

  explore:
    desc: Run exploration script (task explore -- <url_path> --login user --click "#sel")
    cmds:
      - docker compose run --rm tests python exploration/explore.py {{.CLI_ARGS}}

  lint:
    desc: Run markdown and changelog checks
    cmds:
      - task: lint:markdown
      - task: lint:changelog

  lint:markdown:
    desc: Lint all markdown files (task lint:markdown -- --fix to autofix)
    cmds:
      - docker run -v ./:/md --rm itkdev/markdownlint markdownlint {{.CLI_ARGS}} '**/*.md'

  lint:changelog:
    desc: Check that CHANGELOG.md has changed compared to origin/main
    cmds:
      - git fetch origin main
      - git diff --quiet origin/main -- CHANGELOG.md && echo "CHANGELOG.md not updated" && exit 1 || exit 0
